<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StatementForge - Splash</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #080c14;
            background: radial-gradient(circle at 50% 40%, #162238 0%, #090d16 75%, #05070d 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            width: 100%;
        }

        .logo {
            width: 84px;
            height: 84px;
            object-fit: contain;
            border-radius: 16px;
            margin-bottom: 16px;
            display: block;
        }

        .title {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin: 0 0 6px 0;
            line-height: 1.2;
            font-family: "Segoe UI", -apple-system, Roboto, sans-serif;
        }

        .subtitle {
            font-size: 11px;
            font-weight: 700;
            color: #3b82f6;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
            letter-spacing: 1px;
            margin-bottom: 28px;
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 200px;
        }

        .progress-track {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #1d4ed8, #60a5fa);
            border-radius: 3px;
            transition: width 0.2s ease-out;
        }

        .status-text {
            font-size: 11px;
            font-weight: 500;
            color: #64748b;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <img src="../assets/logo.png" alt="StatementForge Logo" class="logo">
        <h1 class="title">StatementForge</h1>
        <div class="subtitle">AI POWERED ACCOUNTING HUB</div>
        <div class="tagline">Parse &bull; Verify &bull; Analyze &bull; Export</div>
        <div class="loading-container">
            <div class="progress-track">
                <div id="progress-fill" class="progress-bar"></div>
            </div>
            <div id="status-text" class="status-text">Loading StatementForge...</div>
        </div>
    </div>

    <script>
        function updateStatus(text, progress) {
            if (text) {
                document.getElementById('status-text').textContent = text;
            }
            if (progress !== undefined && progress !== null) {
                document.getElementById('progress-fill').style.width = progress + '%';
            }
        }
    </script>
</body>
</html>
