<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Center - StatementForge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/notifications.css">
</head>
<body>
    <div class="notifications-container">
        
        <!-- Header -->
        <div class="page-header">
            <div class="header-title-block">
                <div class="header-title-row">
                    <div class="header-icon-badge">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </div>
                    <h1>Notification Center</h1>
                </div>
                <p>Stay updated with statement processing, financial risks, exports, and account activity.</p>
            </div>
            <div class="header-actions">
                <button type="button" class="btn-header-action" onclick="sendAppCommand('notifications_mark_all_read', '')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    Mark All as Read
                </button>
                <button type="button" class="btn-header-action btn-dismiss-all" onclick="sendAppCommand('notifications_dismiss_all', '')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    Dismiss All
                </button>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <button type="button" class="filter-btn active" id="flt-all" onclick="sendAppCommand('notifications_filter', 'all')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                All <span class="badge-count" id="cnt-all">0</span>
            </button>
            <button type="button" class="filter-btn" id="flt-ai_risk" onclick="sendAppCommand('notifications_filter', 'ai_risk')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                AI Risk Flags <span class="badge-count" id="cnt-ai_risk">0</span>
            </button>
            <button type="button" class="filter-btn" id="flt-parsing_export" onclick="sendAppCommand('notifications_filter', 'parsing_export')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Parsing &amp; Exports <span class="badge-count" id="cnt-parsing_export">0</span>
            </button>
            <button type="button" class="filter-btn" id="flt-system_security" onclick="sendAppCommand('notifications_filter', 'system_security')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                System &amp; Security <span class="badge-count" id="cnt-system_security">0</span>
            </button>
        </div>

        <!-- Notification List Grid -->
        <div class="notifications-list" id="notificationsList">
            <!-- Rendered dynamically by Python backend -->
        </div>

    </div>

    <script>
        function sendAppCommand(cmd, payload) {
            document.title = "app-cmd:" + cmd + ":" + (payload || "");
        }

        function setCategoryFilter(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('flt-' + category);
            if (activeBtn) activeBtn.classList.add('active');
        }
    </script>
</body>
</html>
